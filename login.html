
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #312e81);
        }

        .login-box {
            width: 100%;
            max-width: 380px;
            background: #1e293b;
            color: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            font-size: 45px;
            margin-bottom: 15px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"],
        input [type="phone number"],
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #475569;
            border-radius: 7px;
            background: #0f172a;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #818cf8;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 60px;
        }

        .show-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #a5b4fc;
            cursor: pointer;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin: 18px 0;
            font-size: 12px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 0;
        }

        a {
            color: #a5b4fc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #6366f1;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #4f46e5;
        }

        #message {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
            line-height: 1.5;
        }

        .signup {
            text-align: center;
            font-size: 14px;
            color: #cbd5e1;
            margin-top: 25px;
        }

        @media (max-width: 400px) {
            .login-box {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-box">
        <div class="logo">🔐</div>

        <h2>Welcome to our services!</h2>
        <p class="subtitle">Login to your account</p>

        <form id="loginForm">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>

            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="show-btn"
                    id="showPassword"
                >Show</button>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>

                <a href="forgot-password.html" id="forgot-password">Forgot password?</a><br><br>
                <a href="index.html" id="login">
                    <button type="button">LOGIN</a></button><br><br><br><br><br><br><br>
                    
              </div>
            <p id="message" role="status" aria-live="polite"></p>
        </form>

        <p class="signup">
            Don't have an account?
            <a href="register.html" id="register">Sign up</a>
        </p>
    </div>

    <script>
        const form = document.getElementById("loginForm");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const showPassword = document.getElementById("showPassword");
        const message = document.getElementById("message");

        // Show or hide password
        showPassword.addEventListener("click", function () {
            if (password.type === "password") {
                password.type = "text";
                showPassword.textContent = "Hide";
            } else {
                password.type = "password";
                showPassword.textContent = "Show";
            }
        });

        // Login form validation
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            if (!email.checkValidity()) {
                message.style.color = "#fca5a5";
                message.textContent = "Please enter a valid email.";
                return;
            }

            if (password.value.length < 6) {
                message.style.color = "#fca5a5";
                message.textContent =
                    "Password must be at least 6 characters.";
                return;
            }

            message.style.color = "#86efac";
            message.textContent =
                "Form validated! Real login requires authentication.";
        });

        // Forgot password link
        document.getElementById("forgotPassword")
            .addEventListener("click", function (event) {
                event.preventDefault();
                message.style.color = "#a5b4fc";
                message.textContent =
                    "Connect a password-reset service to continue.";
            });

        // Sign-up link
        document.getElementById("signup")
            .addEventListener("click", function (event) {
                event.preventDefault();
                message.style.color = "#a5b4fc";
                message.textContent =
                    "A registration page is needed to create an account.";
            });
    </script>

</body>
</html>
