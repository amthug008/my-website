
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
      padding: 20px;
    }

    .container {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .icon {
      width: 75px;
      height: 75px;
      background: #eef2ff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      margin: 0 auto 22px;
    }

    h1 {
      font-size: 27px;
      color: #1f2937;
      margin-bottom: 12px;
    }

    .description {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #374151;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    button {
      width: 100%;
      padding: 14px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #4338ca;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      background: #ecfdf5;
      color: #065f46;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }

    .back-link {
      display: inline-block;
      margin-top: 25px;
      color: #4f46e5;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .container {
        padding: 32px 22px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <main class="container">
    <div class="icon" aria-hidden="true">🔐</div>

    <h1>Forgot Password?</h1>

    <p class="description">
      Don't worry! It happens to everyone.
      Enter your registered email address and
      we'll help you reset your password.
    </p>

    <form id="resetForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="Enter your email address"
          autocomplete="email"
          required
        >
      </div>

      <button type="submit">Send Reset Link</button>
    </form>

    <div class="message" id="successMessage" role="status">
    your password will be sent on the filled email address.
    </div>

    <a href="login.html" class="back-link">
      ← Back to Login
    </a>
  </main>

  <script>
    const form = document.getElementById("resetForm");
    const message = document.getElementById("successMessage");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      if (form.checkValidity()) {
        message.style.display = "block";
        form.reset();
      }
    });
  </script>

</body>
</html>
